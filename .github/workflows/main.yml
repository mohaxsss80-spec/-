name: Official Android APK Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Standard Directory Structure
        run: |
          mkdir -p app/src/main/java app/src/main/res/layout app/src/main/res/values
          mv *.java app/src/main/java/ 2>/dev/null || true
          mv activity_*.xml app/src/main/res/layout/ 2>/dev/null || true
          mv colors.xml app/src/main/res/values/ 2>/dev/null || true
          mv ic_launcher*.xml app/src/main/res/layout/ 2>/dev/null || true
          mv logo_circle.xml app/src/main/res/layout/ 2>/dev/null || true
          mv AndroidManifest.xml app/src/main/ 2>/dev/null || true
          mv build.gradle app/ 2>/dev/null || true

      - name: Generate Fresh Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.2

      - name: Build APK with Official Tools
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Generated-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
